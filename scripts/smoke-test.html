<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Overlay Smoke Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, #eef4ff 0%, #f8fbff 48%, #edf8f3 100%);
      }

      main {
        width: min(520px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(30, 64, 175, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 24px;
        color: #475569;
        line-height: 1.55;
      }

      label {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
        color: #334155;
        font-size: 14px;
      }

      input,
      button {
        min-height: 42px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        border: 1px solid #94a3b8;
        padding: 0 12px;
      }

      button {
        border: 0;
        padding: 0 18px;
        color: #ffffff;
        background: #1d4ed8;
        cursor: pointer;
      }

      output {
        display: block;
        min-height: 24px;
        margin-top: 18px;
        color: #166534;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cursor Overlay Smoke Test</h1>
      <p>
        This local page verifies that the visible browser mode renders a moving
        cursor and a click pulse without changing the page behavior.
      </p>
      <label>
        Test value
        <input id="name" value="Codex visible browser" />
      </label>
      <button id="action" type="button">Run action</button>
      <output id="result"></output>
    </main>
    <script>
      const action = document.querySelector("#action");
      const name = document.querySelector("#name");
      const result = document.querySelector("#result");

      action.addEventListener("click", () => {
        result.textContent = `Action ran for ${name.value}`;
      });
    </script>
  </body>
</html>
